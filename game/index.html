<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RhythmEyez</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles/theme.css">
  <link rel="stylesheet" href="/src/styles/ui.css">
  <link rel="stylesheet" href="/src/styles/play.css">
  <link rel="stylesheet" href="/src/styles/online.css">
</head>
<body>
  <div id="bg" aria-hidden="true"></div>
  <!-- the webcam: must stay in the page for Chrome to keep delivering frames; the face check shows it -->
  <video id="camera" muted playsinline aria-hidden="true"></video>
  <main id="app"></main>
  <div id="overlay-layer"></div>
  <div id="gaze-cursor" aria-hidden="true"></div>
  <div id="dwell-ring" aria-hidden="true"><div class="pie"></div></div>
  <div id="input-badge"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>

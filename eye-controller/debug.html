<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tracker Debug</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #0b0b12; color: #dde; font: 14px system-ui; }
    main { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; padding: 16px; }
    @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
    canvas { background: #000; border-radius: 8px; max-width: 100%; }
    #frame { width: 100%; }
    .eyes { display: flex; gap: 8px; margin-top: 8px; }
    .eyes canvas { width: 256px; height: 128px; image-rendering: pixelated; }
    pre { white-space: pre-wrap; line-height: 1.5; margin: 12px 0 0; }
    label { display: grid; grid-template-columns: 90px 1fr 44px; gap: 8px; align-items: center; margin: 6px 0; }
    label.check { grid-template-columns: auto 1fr; }
    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: #8fa; margin: 18px 0 6px; }
    button, a.btn { font: inherit; color: #dde; background: #1a1a2a; border: 1px solid #4de1ff; border-radius: 8px; padding: 7px 10px; cursor: pointer; margin: 0 6px 6px 0; text-decoration: none; display: inline-block; }
    #gaze { position: fixed; width: 24px; height: 24px; margin: -12px 0 0 -12px; border-radius: 50%; border: 3px solid #ffd34d; pointer-events: none; z-index: 5; }
  </style>
</head>
<body>
  <div id="gaze"></div>
  <main>
    <section>
      <canvas id="frame" width="960" height="540"></canvas>
      <div class="eyes"><canvas id="eyeL" width="64" height="32"></canvas><canvas id="eyeR" width="64" height="32"></canvas></div>
      <pre id="stats">starting camera...</pre>
    </section>
    <aside>
      <a class="btn" href="./">Back to Hello Lanes</a>
      <h2>Calibration</h2>
      <button id="calibrate">Calibrate</button><button id="quick">Quick</button><button id="topup">Top-up weak</button>
      <button id="save">Save profile</button><button id="load">Load profile</button>
      <h2>Camera adjust</h2>
      <div id="sliders"></div>
      <h2>Recording</h2>
      <button id="record">Start recording</button>
      <h2>Pooled baseline</h2>
      <button id="export">Export</button><button id="import">Import</button>
      <input id="file" type="file" accept="application/json" hidden>
    </aside>
  </main>
  <script type="module" src="/harness/debug.js"></script>
</body>
</html>

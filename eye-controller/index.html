<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello Lanes</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0b12; color: #dde; font: 15px system-ui; overflow: hidden; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
    #hud { position: fixed; left: 12px; bottom: 12px; white-space: pre; line-height: 1.5; pointer-events: none; }
    #bar { position: fixed; right: 12px; bottom: 12px; display: flex; gap: 8px; }
    button, a.btn { font: inherit; color: #dde; background: #1a1a2a; border: 1px solid #4de1ff; border-radius: 8px; padding: 8px 12px; cursor: pointer; text-decoration: none; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="hud"></div>
  <div id="bar">
    <button id="calibrate">Calibrate (C)</button>
    <button id="topup">Top-up weak cells (T)</button>
    <button id="facecheck">Face check (V)</button>
    <a class="btn" id="mode"></a>
    <a class="btn" href="debug.html">Tracker debug</a>
  </div>
  <script type="module" src="/harness/hello-lanes.js"></script>
</body>
</html>
